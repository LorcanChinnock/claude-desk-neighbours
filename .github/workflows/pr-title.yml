name: pr-title

# PRs are squash-merged with the PR title as the commit, and release-please reads that
# commit to pick the next version, so the title must be a conventional commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check, so main's ruleset needs it by name.
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title \"$TITLE\" isn't a conventional commit, e.g. \"feat(your-serve): ask several questions one at a time\" or \"fix(grudge): ...\". feat bumps the minor version, fix the patch; other types don't release."
            exit 1
          fi
