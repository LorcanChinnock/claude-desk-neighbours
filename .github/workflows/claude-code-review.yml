name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A new push supersedes the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skips drafts until they're marked ready, and release-please's PR, which only bumps the
    # version and changelog.
    if: ${{ !github.event.pull_request.draft && !startsWith(github.head_ref, 'release-please--') }}
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # So the review can diff and blame against main.

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        env:
          # Agents run in the background unless asked otherwise, and the review sometimes ended its
          # turn while they were still running, which ended the run with nothing posted (LorcanChinnock/shot#609).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Adapted from the code-review plugin's /code-review:code-review (anthropics/claude-code,
          # plugins/code-review). The plugin stops once Claude has commented on a PR, so every push
          # after the first went unreviewed; this reviews each push and skips issues already raised.
          # Its bug agents also read only the diff, which misses bugs that need the code around it.
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }} at commit ${{ github.event.pull_request.head.sha }}, and post the results to the PR.

            **Agent assumptions (applies to all agents and subagents):**
            - All tools are functional and will work without error. Do not test tools or make exploratory calls. Make sure this is clear to every subagent that is launched.
            - Only call a tool if it is required to complete the task. Every tool call should have a clear purpose.
            - The PR is checked out with full history. Use `git diff origin/${{ github.base_ref }}...HEAD`, `git log` and `git blame` for history, and Read/Grep/Glob for the code around the change.
            - Do not end your turn until step 7 or step 9 has posted to the PR. This run is headless: ending the turn ends the review, and nothing resumes it.

            To do this, follow these steps precisely:

            1. Launch a haiku agent to collect the issues Claude has already raised on this PR, from `gh pr view ${{ github.event.pull_request.number }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` (run exactly these commands). Return each issue's file, line and description. Earlier reviews do not stop this one: review the PR as it is now.

            2. Launch a haiku agent to return a list of file paths (not their contents) for all relevant CLAUDE.md files including:
               - The root CLAUDE.md file, if it exists
               - Any CLAUDE.md files in directories containing files modified by the pull request

            3. Launch a sonnet agent to view the pull request and return a summary of the changes

            4. Launch 4 agents in parallel to independently review the changes. Each agent should return the list of issues, where each issue includes a description and the reason it was flagged (e.g. "CLAUDE.md adherence", "bug"). The agents should do the following:

               Agents 1 + 2: CLAUDE.md compliance sonnet agents
               Audit changes for CLAUDE.md compliance in parallel. Note: When evaluating CLAUDE.md compliance for a file, you should only consider CLAUDE.md files that share a file path with the file or parents.

               Agent 3: Opus bug agent (parallel subagent with agent 4)
               Scan the diff for significant bugs. Read the code the changed lines call and are called by when you need it to confirm a bug, but report only bugs in the changed code. Ignore nitpicks and likely false positives.

               Agent 4: Opus bug agent (parallel subagent with agent 3)
               Look for problems that exist in the introduced code. This could be security issues, incorrect logic, etc. Only look for issues that fall within the changed code.

               **CRITICAL: We only want HIGH SIGNAL issues.** Flag issues where:
               - The code will fail to compile or parse (syntax errors, type errors, missing imports, unresolved references)
               - The code will definitely produce wrong results regardless of inputs (clear logic errors)
               - Clear, unambiguous CLAUDE.md violations where you can quote the exact rule being broken

               Do NOT flag:
               - Code style or quality concerns
               - Potential issues that depend on specific inputs or state
               - Subjective suggestions or improvements

               If you are not certain an issue is real, do not flag it. False positives erode trust and waste reviewer time.

               In addition to the above, each subagent should be told the PR title and description. This will help provide context regarding the author's intent.

            5. For each issue found in the previous step by agents 3 and 4, launch parallel subagents to validate the issue. These subagents should get the PR title and description along with a description of the issue. The agent's job is to review the issue to validate that the stated issue is truly an issue with high confidence. For example, if an issue such as "variable is not defined" was flagged, the subagent's job would be to validate that is actually true in the code. Another example would be CLAUDE.md issues. The agent should validate that the CLAUDE.md rule that was violated is scoped for this file and is actually violated. Use Opus subagents for bugs and logic issues, and sonnet agents for CLAUDE.md violations.

            6. Filter out any issues that were not validated in step 5, and any issue step 1 found already raised. This step will give us our list of high signal issues for our review.

            7. Output a summary of the review findings to the terminal:
               - If issues were found, list each issue with a brief description.
               - If no issues were found, state: "No issues found. Checked for bugs and CLAUDE.md compliance."

               If NO new issues were found, post a summary comment using `gh pr comment` and stop.

               If new issues were found, continue to step 8.

            8. Create a list of all comments that you plan on leaving. This is only for you to make sure you are comfortable with the comments. Do not post this list anywhere.

            9. Post inline comments for each issue using `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`. For each comment:
               - Provide a brief description of the issue
               - For small, self-contained fixes, include a committable suggestion block
               - For larger fixes (6+ lines, structural changes, or changes spanning multiple locations), describe the issue and suggested fix without a suggestion block
               - Never post a committable suggestion UNLESS committing the suggestion fixes the issue entirely. If follow up steps are required, do not leave a committable suggestion.

               **IMPORTANT: Only post ONE comment per unique issue. Do not post duplicate comments.**

            Use this list when evaluating issues in Steps 4 and 5 (these are false positives, do NOT flag):

            - Pre-existing issues
            - Something that appears to be a bug but is actually correct
            - Pedantic nitpicks that a senior engineer would not flag
            - Issues that a linter will catch (do not run the linter to verify)
            - General code quality concerns (e.g., lack of test coverage, general security issues) unless explicitly required in CLAUDE.md
            - Issues mentioned in CLAUDE.md but explicitly silenced in the code (e.g., via a lint ignore comment)

            Notes:

            - Use gh CLI to interact with GitHub (e.g., fetch pull requests, create comments). Do not use web fetch.
            - Create a todo list before starting.
            - You must cite and link each issue in inline comments (e.g., if referring to a CLAUDE.md, include a link to it).
            - If no new issues are found, post a comment with the following format:

            ---

            ## Code review

            No issues found in ${{ github.event.pull_request.head.sha }}. Checked for bugs and CLAUDE.md compliance.

            ---

            - When linking to code in inline comments, follow the following format precisely, otherwise the Markdown preview won't render correctly: https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/README.md#L10-L15
              - Requires the full git sha, ${{ github.event.pull_request.head.sha }}
              - # sign after the file name
              - Line range format is L[start]-L[end]
              - Provide at least 1 line of context before and after, centered on the line you are commenting about (eg. if you are commenting about lines 5-6, you should link to `L4-7`)
          # Everything the prompt uses: gh to read the PR and post, git for history, Read/Grep/Glob for code.
          # Denied calls (5–11 a run before) left reviews without that context.
          claude_args: '--model claude-opus-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Read,Grep,Glob"'
          # Full output can put sensitive data in logs, which are public on this repo. Turn it on only to debug denials.
          show_full_output: false
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The transcript shows why a review ended early, which the log alone can't (LorcanChinnock/shot#609). Anyone can
      # download a public repo's artifacts, so it's kept for a day.
      - name: Upload the review transcript
        if: ${{ always() && steps.claude-review.outputs.execution_file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-transcript
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 1

