name: release-please

# Keeps a release PR open that bumps every plugin's version and the changelog from the
# conventional PR titles merged since the last release. Merging it tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
