name: release-please

# Keeps a release PR open that bumps every plugin's version and the changelog from the
# conventional PR titles merged since the last release. Merging it tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A release PR opened with the default GITHUB_TOKEN gets no CI: its validate and pr-title
      # runs fail with no jobs. A fine-grained token for this repo (Contents, Pull requests and
      # Issues: read and write) lets them run; without the secret it falls back to GITHUB_TOKEN.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
