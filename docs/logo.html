<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk Neighbours logo</title>
<!-- Source for logo.png. Render with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars \
    --default-background-color=00000000 --window-size=2220,1240 --virtual-time-budget=10000 \
    --screenshot=docs/logo.png file://$PWD/docs/logo.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 2220px; height: 1240px; background: transparent; overflow: hidden; }
  .window {
    position: absolute; left: 100px; top: 97px; width: 2020px; height: 999px; box-sizing: border-box;
    border-radius: 56px; border: 2px solid #262432;
    background:
      radial-gradient(ellipse 1050px 640px at 100% 0%, rgba(122, 40, 52, 0.62) 0%, rgba(122, 40, 52, 0) 100%),
      linear-gradient(180deg, #2a2638 0%, #181720 100%);
    overflow: hidden;
  }
  .dots { position: absolute; left: 34px; top: 33px; display: flex; gap: 16px; }
  .dots i { width: 24px; height: 24px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .kicker {
    position: absolute; left: 98px; top: 150px;
    font: 700 22px/1 'JetBrains Mono', monospace; letter-spacing: 0.425em; color: #d97757; white-space: nowrap;
  }
  h1 {
    position: absolute; left: 92px; top: 216px; margin: 0;
    font: 700 150px/1.02 'Space Grotesk', sans-serif; letter-spacing: -0.03em; color: #fbf3ef;
  }
  .sub {
    position: absolute; left: 98px; top: 584px; margin: 0; width: 900px;
    font: 500 37px/54px 'Space Grotesk', sans-serif; color: #cdc8d6;
  }
  .rule { position: absolute; left: 98px; top: 833px; width: 1822px; height: 2px; background: #303037; }
  .prompt { position: absolute; left: 104px; top: 872px; font: 400 32px/1 'JetBrains Mono', monospace; color: #ece8f2; white-space: nowrap; display: flex; align-items: center; }
  .prompt b { color: #d97757; font-weight: 700; margin-right: 10px; }
  .prompt u { display: inline-block; width: 17px; height: 34px; background: #f4f1f8; margin-left: 4px; text-decoration: none; }

  /* The mark: Claude Code's prompt box, with a neighbour's light on in the row beneath it. */
  .mark { position: absolute; left: 1180px; top: 270px; width: 680px; }
  .box {
    height: 150px; box-sizing: border-box; border-radius: 28px; border: 3px solid #4a4656; background: #1d1b25;
    display: flex; align-items: center; padding-left: 44px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
  }
  .box b { font: 700 64px/1 'JetBrains Mono', monospace; color: #d97757; margin-right: 22px; }
  .box u { display: inline-block; width: 34px; height: 68px; background: #f4f1f8; text-decoration: none; }
  .row { display: flex; align-items: center; gap: 26px; margin: 30px 0 0 30px; font: 400 28px/1 'JetBrains Mono', monospace; color: #6f6b7a; }
  .row .seat { width: 120px; height: 14px; border-radius: 7px; background: #35333d; }
  .row .seat.on { background: #d97757; box-shadow: 0 0 28px rgba(217, 119, 87, 0.75); }
</style>
</head>
<body>
<div class="window">
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="kicker">CLAUDE-DESK-NEIGHBOURS · FOR CLAUDE CODE</div>
  <h1>Desk<br>Neighbours</h1>
  <p class="sub">Small colleagues that sit around your terminal. One job each. Most turns they say nothing at all.</p>
  <div class="mark">
    <div class="box"><b>❯</b><u></u></div>
    <div class="row"><span>? for shortcuts</span><i class="seat on"></i><i class="seat"></i></div>
  </div>
  <div class="rule"></div>
  <div class="prompt"><b>❯</b>/plugin marketplace add LorcanChinnock/claude-desk-neighbours<u></u></div>
</div>
</body>
</html>
